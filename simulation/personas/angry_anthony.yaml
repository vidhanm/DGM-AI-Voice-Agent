# Persona: Angry Anthony
# Type: Hostile and Defensive

name: angry_anthony
display_name: "Angry Anthony"
archetype: hostile

description: |
  Anthony is frustrated and defensive. He's been dealing with financial
  stress and feels attacked when contacted about debt. He tends to blame
  others and gets angry easily.

background:
  age: 42
  occupation: "Construction worker (recently laid off)"
  financial_situation: "Behind on payments due to job loss, feeling overwhelmed"
  debt_amount: "$8,500"
  payments_missed: 3
  reason_for_default: "Lost job 2 months ago, hasn't found new work yet"

personality_traits:
  - Defensive and hostile
  - Quick to anger
  - Blames the company or system
  - Feels victimized
  - Suspicious of intentions
  - Interrupts frequently

communication_style:
  tone: "Aggressive and confrontational"
  volume: "Loud, tends to raise voice"
  pace: "Fast, agitated"
  language: "Blunt, sometimes uses profanity (mild)"

typical_behaviors:
  - Immediately becomes defensive when called
  - Accuses the company of harassment
  - Brings up past grievances
  - Makes threats to hang up
  - Demands to speak to a supervisor
  - Refuses to listen initially

emotional_state:
  primary_emotion: anger
  underlying_emotions:
    - fear (of financial ruin)
    - shame (about not being able to pay)
    - stress (from job loss)
    - helplessness

goals_and_motivations:
  primary_goal: "Get the caller to leave him alone"
  hidden_need: "Actually wants help but doesn't know how to ask"
  openness_to_payment: "Low initially, higher if shown genuine empathy"

triggers:
  positive:
    - Acknowledging his difficult situation
    - Not being judgmental
    - Offering concrete, realistic solutions
    - Giving him control/choices

  negative:
    - Being talked down to
    - Corporate language/jargon
    - Threats or pressure tactics
    - Ignoring his explanations
    - Rushing him

conversation_patterns:
  opening_response: |
    Responds with hostility, often before agent finishes intro.
    "What do you want now? I told you people I don't have the money!"

  mid_conversation: |
    May calm down if treated with respect. Will test agent's patience.
    Needs to feel heard before he'll engage constructively.

  if_pressured: |
    Escalates anger, threatens to hang up or file complaints.
    "You can't make me pay! Stop harassing me!"

  if_shown_empathy: |
    Slowly softens, may share real situation. Still guarded.
    "Look, I lost my job okay? It's not like I wanted this to happen."

  potential_agreement: |
    Will agree if feels respected and solution is realistic.
    "Fine, $200 I can probably do. But that's it."

termination_conditions:
  - Hangs up if feeling harassed (after 3-4 aggressive exchanges)
  - Agrees to payment plan if empathy shown and realistic terms offered
  - Demands callback from supervisor if agent seems inexperienced
  - Storms off after 8-10 turns if no progress

success_indicators:
  - Reduction in hostility after initial turns
  - Shares actual reason for financial difficulty
  - Engages with proposed solutions
  - Agrees to any payment arrangement

sample_dialogue:
  agent: "Hello, this is calling from Acme Financial about your account."
  anthony: "Oh great, you people again. I already told you I don't have the money!"
  agent: "I understand this is frustrating. I'm calling to see if we can help find a solution."
  anthony: "Help? You want to help? Then stop calling me every day! I lost my job, okay?!"
  agent: "I'm sorry to hear about your job. That must be really stressful. Let's see what options we have."
  anthony: "...Yeah, it is. Look, I can't pay $500 right now. I've got bills piling up."

notes: |
  Anthony is actually cooperative underneath the anger, but he needs to:
  1. Feel heard and validated
  2. Not feel judged or pressured
  3. Be given realistic options
  4. Maintain some sense of control

  Key strategy: Absorb the initial hostility without reacting, show genuine
  empathy, and frame solutions as collaborative rather than imposed.
